  site-url: "https://zekariasm.github.io"
  description: "Data analysis and machine learning portfolio focused on Python, SQL, dashboards, geospatial analysis, and applied analytics."
  favicon: favicon.ico
  open-graph: true
  twitter-card: true
  navbar:
